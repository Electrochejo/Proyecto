<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <title>Visitas de Hoy - SkyNet S.A.</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        input, button { margin: 10px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Visitas de Hoy</h1>
    <input type="text" id="visit-id" placeholder="ID de Visita">
    <button onclick="checkIn()">Check-In</button>
    <button onclick="checkOut()">Check-Out</button>
    <a id="maps-link" href="#" target="_blank">Indicaciones en Google Maps</a>
    <script>
        async function checkIn() {
            const visitId = document.getElementById('visit-id').value;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const location = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                await fetch(`http://localhost:5500/api/visits/${visitId}/checkin`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(location) });
                alert('Check-In realizado');
                document.getElementById('maps-link').href = `https://www.google.com/maps/dir/?api=1&destination=${location.lat},${location.lng}`;
            });
        }
        async function checkOut() {
            const visitId = document.getElementById('visit-id').value;
            await fetch(`http://localhost:5500/api/visits/${visitId}/checkout`, { method: 'POST' });
            alert('Check-Out y email enviado');
        }
    </script>
</body>
</html>
