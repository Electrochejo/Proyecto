<!DOCTYPE html>
<html lang="es">
<head>
       <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <title>Planificar Visita - SkyNet S.A.</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        form { max-width: 400px; }
        input, select, button { display: block; margin: 10px; padding: 10px; width: 100%; }
    </style>
</head>
<body>
    <h1>Planificar Visita</h1>
    <form id="visit-form">
        <select id="client-id">
            <option>Seleccionar Cliente</option>
        </select>
        <input type="text" id="technician-id" placeholder="ID Técnico">
        <input type="datetime-local" id="date">
        <button type="submit">Planificar</button>
    </form>
    <script>
        async function loadClients() {
            const res = await fetch('http://localhost:5500/api/clients');
            const clients = await res.json();
            const select = document.getElementById('client-id');
            clients.forEach(c => select.innerHTML += `<option value="${c.id}">${c.name}</option>`);
        }
        loadClients();
        document.getElementById('visit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const visit = {
                clientId: document.getElementById('client-id').value,
                technicianId: document.getElementById('technician-id').value,
                scheduledDate: document.getElementById('date').value
            };
            await fetch('http://localhost:5500/api/visits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(visit) });
            alert('Visita planificada');
        });
    </script>
</body>
</html>
